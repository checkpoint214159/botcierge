{# Shared header for the catalogue pages (A03-A05) and the recommendation models page, so they read as one area. #}
{% with name=request.resolver_match.url_name %}
<ul class="nav nav-tabs mb-3">
  <li class="nav-item"><a class="nav-link {% if 'robot' in name %}active{% endif %}" href="{% url 'staffpanel:robot_list' %}">Robots</a></li>
  <li class="nav-item"><a class="nav-link {% if 'fleet' in name %}active{% endif %}" href="{% url 'staffpanel:fleet_list' %}">Fleet units</a></li>
  <li class="nav-item"><a class="nav-link {% if 'addon' in name %}active{% endif %}" href="{% url 'staffpanel:addon_list' %}">Attachments</a></li>
  <li class="nav-item"><a class="nav-link {% if 'skillpack' in name %}active{% endif %}" href="{% url 'staffpanel:skillpack_list' %}">Skill packs</a></li>
  <li class="nav-item"><a class="nav-link {% if name == 'ml_models' %}active{% endif %}" href="{% url 'staffpanel:ml_models' %}">Recommendation models</a></li>
</ul>
{% endwith %}
