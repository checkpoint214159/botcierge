{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="bc-card p-4">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post">{% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors|join:" " }}</div>{% endif %}
      <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required autofocus></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn bc-btn w-100">Log in</button>
    </form>
    <p class="small text-muted mt-3 mb-0">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div></div>
{% endblock %}
